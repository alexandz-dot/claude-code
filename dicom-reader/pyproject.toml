[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-reader"
version = "0.1.0"
description = "DICOM viewer for CT and PET/CT examination with MPR, fusion, SUV, and measurement tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Claude Code" }]
dependencies = [
    "pydicom>=2.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "Pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-qt>=4.2", "responses>=0.24"]
ai = [
    "totalsegmentator>=2.0",
    "nibabel>=5.1",
    "torch>=2.0",
]

[project.scripts]
dicom-reader = "dicom_reader.__main__:main"

[tool.setuptools.packages.find]
include = ["dicom_reader*"]
